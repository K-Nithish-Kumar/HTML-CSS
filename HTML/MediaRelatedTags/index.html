<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image</title>
</head>
<body>
    <h1>Dog</h1>

    <h2>Dog Image</h2>
    <!-- img element is used to represent the image in our website -->
    <img src="../Basics/CreatingImages/dog.png" alt="dog-image">
 
    <!-- audio element is used to add the audio content to our website -->
    <h2>Audio</h2>
    <audio src="../Basics/CreatingImages/despair.mp3" controls autoplay></audio>

    <!-- video element is used to represent video content -->
     <h2>Dog Video</h2>
    <video controls width="800" height="200">
        <source src="../Basics/CreatingImages/dog.mp4" type="video/mp4">
    </video>
    
</body>
</html>
